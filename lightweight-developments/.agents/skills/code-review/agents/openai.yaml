interface:
  display_name: "Code Review (NIU)"
  short_description: "Review changes, challenge contracts, audit decision logic"
  brand_color: "#2563EB"
  default_prompt: "Use $code-review. For a completed change, report concrete defects by severity (Change mode). For a spec, plan, or migration, test it against its contract (Contract mode). For rules or state transitions, look for counterexamples and unnecessary complexity (Decision logic mode). Review only; do not edit."
